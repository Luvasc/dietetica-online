<app-header></app-header>

<app-cart></app-cart>

<!-- INICIO -->
<div id="inicio">
  <app-hero></app-hero>
</div>

<!-- CATEGORÍAS -->
<app-category-list></app-category-list>

<!-- PRODUCTOS -->
<section
  class="featured-products"
  id="productos"
>
  <div class="featured-heading">
    <p>SELECCIÓN ESPECIAL</p>

    <h2>Productos destacados</h2>

    <p>
      Algunos de los productos más elegidos por nuestros clientes.
    </p>
  </div>

  <div class="products-grid">
    @for (product of featuredProducts; track product.id) {
      <app-product-card
        [product]="product"
      ></app-product-card>
    }
  </div>
</section>

<!-- CÓMO COMPRAR -->
<div id="como-comprar">
  <app-how-to-buy></app-how-to-buy>
</div>

<!-- CONTACTO -->
<div id="contacto">
  <app-contact-cta></app-contact-cta>
</div>

<!-- FOOTER -->
<app-footer></app-footer>
